<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style type="text/css">
      body,
      html {
        margin: 0;
        overflow: hidden;
        text-align: center;
        background-color: black;
        padding-top: 5vmin;
        -ms-user-select: none;
        cursor: default;
      }

      img {
        border-style: none;
      }

      .bg {
        position: absolute;
        width: auto;
        height: 100vmin;
        min-width: 100vmin;
        min-height: 100vmin;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
        image-rendering: pixelated;
      }

      .container_terminal {
        position: absolute;
        width: 100%;
        height: calc(100% - 7vmin);
        overflow: clip;
        box-sizing: border-box;
        padding: 3vmin 2vmin;
        top: 0%;
        left: 0%;
        z-index: 1;
      }

      .terminal_text {
        display: inline-block;
        font-weight: lighter;
        text-decoration: none;
        width: 100%;
        text-align: right;
        color: green;
        text-shadow: 1px 1px black;
        margin-right: 0%;
        margin-top: 0px;
        font-size: 2vmin;
        line-height: 1vmin;
        letter-spacing: 1px;
      }

      .container_progress {
        position: absolute;
        box-sizing: border-box;
        bottom: 3vmin;
        left: 2vmin;
        height: 4vmin;
        width: calc(100% - 4vmin);
        border-left: 2px solid green;
        border-right: 2px solid green;
        padding: 4px;
        background-color: black;
      }

      .progress_bar {
        width: 0%;
        height: 100%;
        background-color: green;
      }

      .container_status {
        position: absolute;
        box-sizing: border-box;
        width: 90vmin;
        top: calc(50% - 32vmin);
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        color: #cde;
        font-family: "Courier New";
        text-shadow: 1px 1px black;
        text-align: center;
      }

      .container_nav {
        position: absolute;
        box-sizing: border-box;
        width: 90vmin;
        min-height: 10vmin;

        top: calc(50% + 22.5vmin);
        left: 50%;
        transform: translate(-50%, -50%);

        z-index: 1;
      }

      .menu_button {
        display: block;
        box-sizing: border-box;
        font-family: "Courier New";
        text-decoration: none;
        font-size: 3vmin;
        line-height: 4vmin;
        width: 100%;
        text-align: left;
        color: white;
        height: 3vmin;
        letter-spacing: 1px;
        cursor: pointer;
        white-space: nowrap;
        text-transform: lowercase;
      }

      .menu_button:hover {
        padding-left: 0px;
        color: yellow;
      }

      .menu_button:active {
        padding-left: 0px;
        transform: translate(2px, 2px);
      }

      .menu_newpoll {
        padding-left: 0px;
      }

      .container_notice {
        position: absolute;
        box-sizing: border-box;
        width: auto;
        padding-top: 1vmin;
        top: calc(50% - 10vmin);
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
      }

      .menu_notice {
        display: inline-block;
        font-family: "Courier New";
        font-weight: lighter;
        text-decoration: none;
        width: 100%;
        text-align: left;
        color: red;
        text-shadow:
          1px 0px black,
          -1px 0px black,
          0px 1px black,
          0px -1px black,
          2px 0px black,
          -2px 0px black,
          0px 2px black,
          0px -2px black;
        margin-right: 0%;
        margin-top: 0px;
        font-size: 3vmin;
        line-height: 2vmin;
      }

      .unchecked {
        color: #f44;
      }

      .checked {
        color: #4f4;
      }
    </style>
  </head>
  <body></body>
</html>
